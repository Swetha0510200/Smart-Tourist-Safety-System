<!DOCTYPE html>

<html>
<head>
    <title>Smart Tourist Safety</title>


<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI',sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#1e3c72,#2a5298,#4f46e5);
    }

    .container{
        width:650px;
        padding:45px;
        border-radius:25px;
        background:rgba(255,255,255,0.15);
        backdrop-filter:blur(15px);
        box-shadow:0 10px 30px rgba(0,0,0,0.25);
        color:white;
    }

    .logo{
        text-align:center;
        margin-bottom:10px;
    }

    .logo-icon{
        font-size:65px;
    }

    h1{
        text-align:center;
        margin-top:10px;
        margin-bottom:10px;
    }

    .subtitle{
        text-align:center;
        font-size:18px;
        margin-bottom:30px;
        color:#e8e8e8;
    }

    .tabs{
        display:flex;
        justify-content:center;
        gap:15px;
        margin-bottom:30px;
    }

    .tabs button{
        background:rgba(255,255,255,0.15);
        color:white;
        border:none;
        padding:12px 20px;
        border-radius:10px;
        font-size:17px;
        font-weight:bold;
        cursor:pointer;
        transition:0.3s;
    }

    .tabs button:hover{
        background:#22c55e;
    }

    input{
        width:100%;
        padding:16px;
        margin-bottom:15px;
        border:none;
        border-radius:12px;
        font-size:16px;
        outline:none;
        background:rgba(255,255,255,0.95);
    }

    .btn{
        width:100%;
        padding:16px;
        border:none;
        border-radius:12px;
        background:linear-gradient(90deg,#22c55e,#16a34a);
        color:white;
        font-size:20px;
        font-weight:bold;
        cursor:pointer;
        transition:0.3s;
    }

    .btn:hover{
        transform:scale(1.02);
    }

    .form-section{
        display:none;
    }

    .active{
        display:block;
    }

    .footer{
        text-align:center;
        margin-top:20px;
        font-size:14px;
        color:#ddd;
    }

</style>


</head>

<body>

<div class="container">


<div class="logo">
    <div class="logo-icon">🛡️</div>
</div>

<h1>Smart Tourist Safety</h1>

<p class="subtitle">
    AI Powered Tourist Monitoring & Emergency Response System
</p>

<div class="tabs">

    <button onclick="showForm('login')">
        Login
    </button>

    <button onclick="showForm('register')">
        Create Account
    </button>

    <button onclick="showForm('forgot')">
        Forgot Password
    </button>

</div>

<!-- LOGIN -->

<div id="login" class="form-section active">

    <form action="/login" method="POST">

        <input type="email"
               name="email"
               placeholder="📧 Email Address"
               required>

        <input type="password"
               name="password"
               placeholder="🔒 Password"
               required>

        <button type="submit" class="btn">
    Login
</button>


<p style="
color:#ffb3b3;
text-align:center;
margin-top:10px;
font-weight:bold;">
</p>

    </form>

</div>

<!-- REGISTER -->

<div id="register" class="form-section">

    <form action="/register" method="POST">

        <input type="text"
               name="fullname"
               placeholder="👤 Full Name"
               required>

        <input type="email"
               name="email"
               placeholder="📧 Email Address"
               required>

        <input type="text"
               name="phone"
               placeholder="📱 Phone Number"
               required>

        <input type="text"
        name="emergency_contact1"
        placeholder="Emergency Contact 1"
        required>

        <input type="text"
        name="emergency_contact2"
        placeholder="Emergency Contact 2"
        required>

        <input type="text"
        name="emergency_contact3"
        placeholder="Emergency Contact 3"
        required>

        <div style="position:relative;">

<input type="password"
id="loginPassword"
name="password"
placeholder="🔒 Password"
required>

<span onclick="togglePassword()"
style="
position:absolute;
right:15px;
top:18px;
cursor:pointer;
color:black;
font-size:18px;">
👁
</span>

</div>

        <button type="submit" class="btn">
            Create Account
        </button>

    </form>

</div>

<!-- FORGOT PASSWORD -->

<div id="forgot" class="form-section">

    <form action="/forgot_password" method="POST">

        <input type="email"
               name="email"
               placeholder="📧 Registered Email"
               required>

        <input type="password"
               name="password"
               placeholder="🔒 New Password"
               required>

        <button type="submit" class="btn">
            Reset Password
        </button>

    </form>

</div>

<div class="footer">
    Smart Tourist Safety System © 2026
</div>


</div>

<script>

function showForm(formId){

    document.getElementById("login").style.display="none";
    document.getElementById("register").style.display="none";
    document.getElementById("forgot").style.display="none";

    document.getElementById(formId).style.display="block";
}

function togglePassword(){

    let pass =
    document.getElementById("loginPassword");

    if(pass.type === "password"){
        pass.type = "text";
    }
    else{
        pass.type = "password";
    }
}

</script>
</body>
</html>
