<!DOCTYPE html>

<html>
<head>
<title>Edit Digital ID</title>

<style>

body{
background:#f4f7fc;
font-family:Arial;
}

.container{
width:700px;
margin:40px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

h1{
text-align:center;
color:#1e3c72;
margin-bottom:25px;
}

input,select,textarea{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:15px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#22c55e;
border:none;
color:white;
font-size:18px;
border-radius:10px;
cursor:pointer;
}

button:hover{
background:#16a34a;
}

</style>

</head>

<body>

<div class="container">

<h1>✏ Edit Tourist Profile</h1>

<form method="POST"
      enctype="multipart/form-data">

      <input type="file" name="photo">
      
<label>Date of Birth</label> <input type="date" name="dob" value="{{ tourist.dob or '' }}">

<label>Gender</label> <select name="gender">

<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<label>Blood Group</label> <input type="text" name="blood_group"
value="{{ tourist.blood_group or '' }}">

<label>Nationality</label> <input type="text" name="nationality"
value="{{ tourist.nationality or '' }}">

<label>Address</label>

<textarea name="address">{{ tourist.address or '' }}</textarea>

<button type="submit">
💾 Save Changes
</button>

<label>Profile Photo</label>

<input type="file"
       name="photo">

</form>

</div>

</body>
</html>
