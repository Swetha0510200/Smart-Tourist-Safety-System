<!DOCTYPE html>
<html>

<head>

<title>Admin Tourists</title>

<style>

body{
font-family:Arial;
background:#eef3fb;
margin:0;
}

.container{
width:95%;
margin:auto;
padding:30px;
}

h1{
color:#2563eb;
}

table{
width:100%;
border-collapse:collapse;
background:white;
margin-top:20px;
}

th{
background:#2563eb;
color:white;
padding:15px;
}

td{
padding:12px;
text-align:center;
border-bottom:1px solid #ddd;
}

tr:hover{
background:#f5f5f5;
}

.back{
display:inline-block;
margin-bottom:20px;
padding:10px 20px;
background:#2563eb;
color:white;
text-decoration:none;
border-radius:8px;
}

</style>

</head>

<body>

<div class="container">

<a href="/admin_dashboard" class="back">
← Back to Dashboard
</a>

<h1>Registered Tourists</h1>

<table>

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Phone</th>

<th>Nationality</th>

<th>Risk Level</th>

<th>Safety Score</th>

</tr>

{% for tourist in tourists %}

<tr>

<td>{{ tourist.id }}</td>

<td>{{ tourist.fullname }}</td>

<td>{{ tourist.email }}</td>

<td>{{ tourist.phone }}</td>

<td>{{ tourist.nationality }}</td>

<td>{{ tourist.risk_level }}</td>

<td>{{ tourist.safety_score }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
