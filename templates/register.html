<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>
<body>

<h1>Tourist Registration</h1>

<form method="POST">

    <input type="text"
           name="fullname"
           placeholder="Full Name"
           required>

    <br><br>

    <input type="email"
           name="email"
           placeholder="Email"
           required>

    <br><br>

    <input type="text"
           name="phone"
           placeholder="Phone Number"
           required>

    <br><br>

    <input type="text"
           name="emergency_contact"
           placeholder="Emergency Contact"
           required>

    <br><br>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

</body>
</html>
